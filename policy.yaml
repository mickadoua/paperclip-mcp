# allow: runs. ask: requires your confirmation (MCP elicitation), refused if the
# client cannot ask for it. deny or absent: tool not exposed.
# Decision tools only accept ask or deny.
tools:
  companies: allow
  attention: allow
  issues: allow
  issue: allow
  document: allow
  agents: allow
  approvals: allow
  action_requests: allow
  issue_comment: allow
  issue_create: allow
  projects: allow
  project_create: allow
  issue_update: ask
  runs: allow
  run: allow
  issue_history: allow
  spend: allow
  activity: allow
  routines: allow
  agent_pause: allow
  agent_wake: allow
  run_stop: allow
  approval_comment: allow
  agent_resume: ask
  agent_unblock: ask
  routine_run: ask
  approval_decision: ask
  interaction_respond: ask
  plan_confirm: deny
  action_request_decision: deny

# issue_update changes that run without confirmation; any other change asks.
issue_update_without_confirmation:
  assign: true
  statuses: [backlog, todo, done, cancelled]
