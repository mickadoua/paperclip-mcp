[project]
name = "paperclip-mcp"
version = "0.1.0"
description = "MCP bridge to Paperclip: companies, issues and decisions, with an allow / ask / deny policy per tool"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["mcp>=2.0.0", "httpx>=0.27", "pyjwt[crypto]>=2.8", "uvicorn>=0.30", "pyyaml>=6"]

[project.scripts]
paperclip-mcp = "paperclip_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["paperclip_mcp"]
